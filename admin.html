<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#090303" />
  <title>Управление каталогом — ПРЕДЛОЖКА141</title>
  <link rel="icon" type="image/svg+xml" href="./assets/images/figma/favicon.svg" />
  <meta http-equiv="refresh" content="0; url=./index.html?view=admin#admin" />
  <script>
    (() => {
      const target = new URL('./index.html?view=admin#admin', window.location.href).href;
      // admin.html — только стабильная точка входа. Без iframe: иначе браузер
      // может восстановить предыдущую вложенную страницу из session history/BFCache.
      window.location.replace(target);
    })();
  </script>
  <style>
    html { color-scheme: dark; background: #050101; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #050101;
      color: #fff3ed;
      font: 16px/1.5 Arial, sans-serif;
    }
    a { color: #ff806a; }
  </style>
</head>
<body>
  <noscript>
    <p><a href="./index.html?view=admin#admin">Открыть управление</a></p>
  </noscript>
</body>
</html>
