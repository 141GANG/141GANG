<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta content="#040404" name="theme-color"/>
<title>Управление — 141GANG</title>
<style>
html,body{min-height:100%;margin:0;background:#080808}
.page-bootstrap{position:fixed;inset:0;display:grid;place-items:center;color:#777;font:14px Arial,sans-serif}
</style>
</head>
<body>
<div aria-live="polite" class="page-bootstrap">Загрузка управления…</div>
<script>
fetch('./index.html', { cache: 'no-cache' })
  .then(response => {
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    return response.text();
  })
  .then(html => {
    document.open();
    document.write(html);
    document.close();
  })
  .catch(error => {
    console.warn('Не удалось открыть страницу управления:', error);
    location.replace('./index.html?view=admin#admin');
  });
</script>
</body>
</html>
