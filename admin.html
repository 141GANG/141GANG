<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#040404" />
  <title>Управление — 141GANG</title>
  <link rel="icon" href="./favicon.ico?v=141gang-1" sizes="any" type="image/x-icon" />
  <style>
    html,
    body {
      width: 100%;
      min-width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      background: #080808;
    }

    .admin-page-frame {
      width: 100%;
      height: 100dvh;
      display: block;
      border: 0;
      background: #080808;
    }

    .admin-page-fallback {
      position: fixed;
      inset: 0;
      z-index: -1;
      display: grid;
      place-items: center;
      padding: 24rem;
      box-sizing: border-box;
      color: #f0f0f0;
      font: 500 15rem/1.5 Arial, sans-serif;
      text-align: center;
    }

    .admin-page-fallback a { color: #ef3d3f; }
  </style>
</head>
<body>
  <div class="admin-page-fallback">
    <span>Загружаем управление…<br><a href="./index.html?view=admin#admin">Открыть управление напрямую</a></span>
  </div>

  <iframe
    class="admin-page-frame"
    id="adminPageFrame"
    src="./index.html?view=admin#admin"
    title="Управление 141GANG"
  ></iframe>

  <script>
    (() => {
      const frame = document.getElementById('adminPageFrame');
      if (!frame) return;

      const normalizeHeaderNavigation = () => {
        try {
          const doc = frame.contentDocument;
          if (!doc) return;

          const brand = doc.querySelector('.site-header .brand');
          if (brand) {
            brand.href = './index.html';
            brand.target = '_top';
          }

          const catalog = doc.querySelector('.site-header .nav-link[href="#catalog"], .site-header .nav-link[href$="index.html#catalog"]');
          if (catalog) {
            catalog.href = './index.html#catalog';
            catalog.target = '_top';
          }

          doc.querySelectorAll('.site-header a[href]').forEach(link => {
            if (link.id === 'adminPortalOpen') return;
            link.target = '_top';
          });

          const admin = doc.getElementById('adminPortalOpen');
          if (admin) {
            admin.href = './admin.html';
            admin.target = '_top';
            admin.setAttribute('aria-current', 'page');
          }
        } catch (error) {
          console.warn('Не удалось синхронизировать навигацию страницы управления:', error);
        }
      };

      const bindPublishedCommentsBridge = () => {
        try {
          const doc = frame.contentDocument;
          const view = frame.contentWindow;
          if (!doc || !view || doc.documentElement.dataset.adminPublishedCommentsBridge === '1') return;
          doc.documentElement.dataset.adminPublishedCommentsBridge = '1';

          // В standalone-admin исходный index.html скрывает прямые дочерние окна.
          // Разрешаем показ только настоящей catalog game modal, не меняя остальной layout.
          let visibilityFix = doc.getElementById('adminDedicatedCatalogModalFix');
          if (!visibilityFix) {
            visibilityFix = doc.createElement('style');
            visibilityFix.id = 'adminDedicatedCatalogModalFix';
            visibilityFix.textContent = `
              html body.standalone-view > #gameModal.game-modal[hidden] { display: none !important; }
              html body.standalone-view > #gameModal.game-modal:not([hidden]) { display: block !important; }
            `;
            doc.head.appendChild(visibilityFix);
          }

          const prepareCatalogModal = () => {
            const modal = doc.getElementById('gameModal');
            if (!modal) return null;

            // index.html?view=admin скрывает все лишние body-элементы не только
            // через CSS, но и inline `display:none !important`. Обычное правило
            // stylesheet это перебить не может, поэтому снимаем именно inline
            // display с настоящего окна каталога перед openGameModal().
            modal.style.removeProperty('display');
            if (modal.parentElement !== doc.body) doc.body.appendChild(modal);
            modal.style.setProperty('z-index', '3000');
            return modal;
          };

          const focusComments = gameId => {
            const modal = prepareCatalogModal();
            if (!modal || modal.hidden) return false;

            const comments = modal.querySelector('.modal-comments');
            const panel = modal.querySelector('.modal-panel');
            if (!comments) return false;

            const move = () => {
              if (modal.hidden || !comments.isConnected) return;
              if (panel) {
                const rootSize = Number.parseFloat(view.getComputedStyle(doc.documentElement).fontSize) || 1;
                const panelRect = panel.getBoundingClientRect();
                const commentsRect = comments.getBoundingClientRect();
                const offset = commentsRect.top - panelRect.top - (18 * rootSize);
                panel.scrollTop = Math.max(0, panel.scrollTop + offset);
              } else {
                comments.scrollIntoView({ block: 'start' });
              }
            };

            view.requestAnimationFrame(() => view.requestAnimationFrame(move));
            view.setTimeout(move, 120);
            view.setTimeout(move, 360);

            const commentsList = modal.querySelector('#modalCommentsList');
            if (commentsList) {
              const observer = new view.MutationObserver(() => {
                if (/Загружаем комментарии/i.test(commentsList.textContent || '')) return;
                move();
                observer.disconnect();
              });
              observer.observe(commentsList, { childList: true, subtree: true });
              view.setTimeout(() => observer.disconnect(), 5000);
            }

            modal.dataset.openedFromAdminComments = String(gameId);
            return true;
          };

          const openCatalogComments = gameId => {
            const id = String(gameId || '').trim();
            if (!id) return;

            let attempt = 0;
            const maxAttempts = 60;
            const open = () => {
              attempt += 1;
              prepareCatalogModal();

              // Это та же функция, которой пользуется карточка игры в index.html.
              // Она заполняет #gameModal и вызывает get_game_interactions() для game_id.
              if (typeof view.openGameModal === 'function') {
                view.openGameModal(id);
              } else {
                const catalogCard = [...doc.querySelectorAll('.game-card[data-game-id]')]
                  .find(card => String(card.dataset.gameId || '') === id);
                catalogCard?.dispatchEvent(new view.MouseEvent('click', {
                  bubbles: true,
                  cancelable: true,
                  view
                }));
              }

              if (focusComments(id)) return;
              if (attempt < maxAttempts) view.setTimeout(open, 100);
              else console.warn(`Не удалось открыть комментарии каталога для игры ${id}.`);
            };

            open();
          };

          // Capture на document срабатывает раньше старого обработчика внутри moderationList.
          // Благодаря этому dedicated admin не зависит от закэшированной версии admin-portal-shell.js.
          doc.addEventListener('click', event => {
            const target = event.target instanceof view.Element ? event.target : null;
            const button = target?.closest('[data-published-comments]');
            if (!button) return;

            event.preventDefault();
            event.stopPropagation();
            openCatalogComments(button.dataset.publishedComments);
          }, true);
        } catch (error) {
          console.warn('Не удалось подключить переход к комментариям каталога:', error);
        }
      };

      const prepareAdminFrame = () => {
        normalizeHeaderNavigation();
        bindPublishedCommentsBridge();
      };

      frame.addEventListener('load', prepareAdminFrame);
    })();
  </script>
</body>
</html>
